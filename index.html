Présente en premier les informations pratiques, même si les coordonnées GPS sont inconnues : consignes de réception, adresse de livraison explicitement publiée, procédure de rendez-vous, horaires de réception (distincts des horaires du magasin), contacts professionnels, restrictions de gabarit ou de circulation publiées. Distingue faits documentés, témoignages et hypothèses non confirmées. Cite les sources pour chaque renseignement important, sans inventer. Ne propose aucun itinéraire non vérifié ni accès non autorisé.
À la fin seulement, si une source publique indique explicitement les coordonnées GPS d'un accès de livraison autorisé, écris sur une ligne distincte exactement « ENTREE PL : latitude, longitude » ou « SORTIE PL : latitude, longitude » (nombres décimaux avec point) avec citation de la source. Ne déduis pas un point du centre du bâtiment, d'une photographie ou d'une adresse approximative. Si les coordonnées manquent, indique-le brièvement, sans omettre les consignes disponibles. Conserve les sources Google Search.`}
function geminiFormatted(text){const out=el('div','','gemini-formatted');const clean=v=>v.replace(/\*\*(.*?)\*\*/g,'$1').replace(/^\*([^*]+)\*$/,'$1').replace(/`([^`]+)`/g,'$1');let list=null;for(const raw of String(text).split('\n')){const line=raw.trim();if(!line||/^[-*_]{3,}$/.test(line)){list=null;continue}const heading=line.match(/^#{1,6}\s+(.+)$/);if(heading){list=null;out.append(el('h4',clean(heading[1])));continue}const item=line.match(/^(?:[-*•]\s+|\d+\.\s+)(.+)$/);if(item){if(!list){list=el('ul');out.append(list)}list.append(el('li',clean(item[1])));continue}list=null;out.append(el('p',clean(line)))}return out}
function geminiParse(data,r){const c=data?.candidates?.[0];if(!c||c.finishReason&&c.finishReason!=='STOP')throw Error('Réponse Gemini incomplète ou bloquée');const text=(c.content?.parts||[]).filter(p=>typeof p.text==='string'&&!p.thought).map(p=>p.text).join('\n');if(!text.trim())throw Error('Réponse Gemini vide');const md=c.groundingMetadata||{};const chunks=Array.isArray(md.groundingChunks)?md.groundingChunks:[];const sources=chunks.map(ch=>({url:safeHttps(ch?.web?.uri),title:String(ch?.web?.title||'Source Google Search')}));const supports=Array.isArray(md.groundingSupports)?md.groundingSupports:[];const points=[];if(valid(r)){for(const line of text.split('\n')){const match=line.match(/^\s*(?:[-*]\s*)?\*{0,2}(ENTR[EÉ]E|SORTIE) PL\s*:\s*\*{0,2}\s*(-?\d{1,2}\.\d{3,8})\s*,\s*(-?\d{1,3}\.\d{3,8})(?:\s|\*|\[|$)/i);if(!match)continue;const a=Number(match[2]),b=Number(match[3]);if(!Number.isFinite(a)||!Number.isFinite(b)||Math.abs(a)>85||Math.abs(b)>180)continue;const dist=Math.hypot((a-r.lat)*111320,(b-r.lon)*111320*Math.cos(r.lat*Math.PI/180));if(dist>2000||dist<1)continue;const linked=supports.filter(s=>typeof s.segment?.text==='string'&&s.segment.text.includes(match[2])&&s.segment.text.includes(match[3])&&text.includes(s.segment.text)).flatMap(s=>s.groundingChunkIndices||[]).filter(i=>Number.isInteger(i)&&sources[i]?.url);if(!linked.length)continue;const type=match[1].toUpperCase().startsWith('SORT')?'Sortie PL':'Entrée PL';if(points.some(p=>p.type===type))continue;points.push({type,lat:a,lon:b,source:sources[linked[0]].url})}}
return {id:r.id,text,sources:sources.filter(s=>s.url),suggestions:typeof md.searchEntryPoint?.renderedContent==='string'?md.searchEntryPoint.renderedContent:'',queries:Array.isArray(md.webSearchQueries)?md.webSearchQueries.filter(x=>typeof x==='string').slice(0,5):[],points,state:'ok'}}
function geminiBox(r){const box=el('section','','assistant');box.id='gemini-research';box.append(el('h3','✦ Gemini · accès livraison'));if(r.demo){box.append(el('p','Pas de requête IA sur les sites fictifs.','muted'));return box}box.append(el('p','Recherche Google déclenchée à la sélection. Les repères IA sont indicatifs et ne constituent pas une autorisation de passage.','muted'));if(!geminiEnabled){box.append(button('Configurer Gemini',geminiConfig,'primary'));return box}const result=geminiResult?.id===r.id?geminiResult:null;if(result?.state==='loading')box.append(el('p','Recherche des accès livraison en cours…','tag'));else if(result?.state==='error'){const error=el('p',result.error,'muted');error.style.whiteSpace='pre-wrap';box.append(error)}else if(result?.state==='ok'){box.append(el('p','Réponse Gemini · à vérifier','tag'));box.append(geminiFormatted(result.text));for(const s of result.sources)box.append(el('p',''),externalLink(s.title,s.url));if(result.suggestions){const frame=el('iframe');frame.title='Suggestions Google Search';frame.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');frame.referrerPolicy='no-referrer';frame.style.cssText='width:100%;height:180px;border:0;background:white;border-radius:8px';frame.srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'+result.suggestions;box.append(frame)}else for(const q of result.queries)box.append(el('p',''),externalLink(q,'https://www.google.com/search?q='+encodeURIComponent(q)));if(result.points.length){box.append(el('p','Repères indicatifs issus de la réponse, non confirmés.','muted'));for(const point of result.points)box.append(button('Afficher '+point.type+' · à vérifier',()=>center(point.lat,point.lon,19)),externalLink('Source du repère',point.source))}else box.append(el('p','Aucun point GPS suffisamment sourcé. Les consignes ci-dessus restent consultables. Aucun marqueur inventé.','muted'))}box.append(button('Relancer Gemini',()=>geminiSearch(r,true),''),button('Paramètres Gemini',geminiConfig),el('p',`${geminiCalls}/${GEMINI_LIMIT} appels lancés durant cette session. Aucun résultat Gemini enregistré automatiquement.`, 'muted'));return box}
function geminiRefresh(r){if(selected?.id!==r.id)return;const old=$('gemini-research');if(old)old.replaceWith(geminiBox(r));schedule()}
async function geminiSearch(r,manual=false){geminiJob?.abort();geminiJob=null;geminiResult=null;if(!geminiEnabled||!geminiKey||r.demo)return;if(geminiBlocked&&!manual){geminiResult={id:r.id,state:'error',error:'Recherches automatiques suspendues après une erreur de quota Google. Vérifie ton quota puis utilise Relancer Gemini.'};geminiRefresh(r);return}if(manual)geminiBlocked=false;if(geminiCalls>=GEMINI_LIMIT){geminiResult={id:r.id,state:'error',error:'Limite locale de session atteinte. Aucun appel supplémentaire.'};geminiRefresh(r);return}const ac=new AbortController();geminiJob=ac;geminiCalls++;geminiResult={id:r.id,state:'loading'};geminiRefresh(r);const timer=setTimeout(()=>ac.abort(),45000);try{const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+geminiModel+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':geminiKey},body:JSON.stringify({contents:[{role:'user',parts:[{text:geminiPrompt(r)}]}],tools:[{google_search:{}}],generationConfig:{temperature:0.2,maxOutputTokens:2048}}),signal:ac.signal,cache:'no-store',credentials:'omit',redirect:'error'});if(!response.ok){if(response.status===429&&geminiJob===ac)geminiBlocked=true;throw await geminiApiError(response,geminiKey)}const data=await response.json();if(geminiJob!==ac||selected?.id!==r.id)return;geminiResult=geminiParse(data,r);if(geminiResult.points.length)center(geminiResult.points[0].lat,geminiResult.points[0].lon,19)}catch(e){if(geminiJob===ac&&selected?.id===r.id)geminiResult={id:r.id,state:'error',error:ac.signal.aborted?'Recherche interrompue ou délai dépassé.':(e instanceof TypeError?'Connexion API impossible (réseau ou CORS).':String(e.message||'Erreur Gemini').slice(0,1100))}}finally{clearTimeout(timer);if(geminiJob===ac){geminiJob=null;geminiRefresh(r)}}}
function geminiPins(left,top,w,h){if(!selected||geminiResult?.id!==selected.id||geminiResult.state!=='ok')return;for(const point of geminiResult.points){const [px,py]=xy(point.lat,point.lon,z),x=px-left,y=py-top;if(x<0||x>w||y<0||y>h)continue;const b=el('button',point.type+' · IA ?', 'pin gemini-pin');b.style.left=x+'px';b.style.top=y+'px';b.style.background=point.type==='Sortie PL'?'#b66318':'#087c67';b.style.zIndex='6';b.setAttribute('aria-label',point.type+' — indication Gemini à vérifier');b.addEventListener('pointerdown',e=>e.stopPropagation());b.onclick=()=>{sheetOpen=true;render();schedule()};pins.append(b)}}
